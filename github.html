<!DOCTYPE html>
<html>
<head>
  <title>GitHub Profile Fetcher</title>
</head>

<body>

  <div>
    <h1>GitHub Profile Fetcher</h1>

    <input type="text" id="usernameInput" placeholder="Enter GitHub username">
    <br><br>

    <button id="searchBtn" onclick="fetchGitHubUser()">Search</button>

    <p id="loading"></p>
    <p id="error" style="color: red;"></p>

    <div id="profile"></div>
  </div>

  <script>
    async function fetchGitHubUser() {
      const username = document.getElementById("usernameInput").value.trim();
      const profile = document.getElementById("profile");
      const error = document.getElementById("error");
      const loading = document.getElementById("loading");
      const button = document.getElementById("searchBtn");

      profile.innerHTML = "";
      error.textContent = "";
      loading.textContent = "";

      if (username === "") {
        error.textContent = "Please enter a GitHub username";
        return;
      }

      try {
        loading.textContent = "Loading...";
        button.disabled = true;

        const response = await fetch(`https://api.github.com/users/${username}`);

        if (!response.ok) {
          throw new Error("User not found");
        }

        const user = await response.json();

        profile.innerHTML = `
          <img src="${user.avatar_url}" alt="GitHub Avatar" width="120">
          <h2>${user.name || user.login}</h2>
          <p><strong>Username:</strong> ${user.login}</p>
          <p><strong>Bio:</strong> ${user.bio || "No bio available"}</p>
          <p><strong>Public Repos:</strong> ${user.public_repos}</p>
          <a href="${user.html_url}" target="_blank">View GitHub Profile</a>
        `;

      } catch (err) {
        error.textContent = err.message;
      } finally {
        loading.textContent = "";
        button.disabled = false;
      }
    }
  </script>

</body>
</html>
